name: Deploy to Dev

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - dev

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install and Build
        env:
          # set CI to false because warnings are treated as errors if CI=true
          # manually set react env here because NODE_ENV=production on build
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_ENV: development
        run: |
          npm install -g pnpm@11.3.0
          pnpm install --frozen-lockfile
          pnpm build

  deploy:
    runs-on: ubuntu-latest
    # `build` is a gate: Heroku rebuilds the frontend on the dyno via
    # heroku-postbuild, so we only need to confirm the build compiles before deploying.
    needs: build
    steps:
      - uses: actions/checkout@v3.3.0

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        uses: AkhileshNS/heroku-deploy@v3.12.13
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: "mentee-dev"
          heroku_email: "h4i.mentee.auth@gmail.com"
          branch: dev
          dontuseforce: false  # This allows force pushing to Heroku
