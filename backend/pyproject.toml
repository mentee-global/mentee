[dependency-groups]
dev = [
  "black==23.1.0",
  "mypy>=0.812",
  "pylint>=2.1.1",
  "pytest>=3.7.1",
]

[tool.uv]
# This is a deployable application, not a distributable package, so uv should
# install the dependencies into the environment without building/installing the
# project itself.
package = false
# Pin floating transitives to the versions the previous (poetry/pip-compile)
# setup resolved, so migrating to uv does not change the deployed package set.
constraint-dependencies = [
  "setuptools==75.3.0",
  "tzlocal==5.2",
]
